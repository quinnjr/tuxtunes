<nav
  class="relative z-40 flex h-8 shrink-0 items-center gap-1 border-b border-[var(--color-border)] bg-[var(--color-bg-surface)] px-2 text-sm text-[var(--color-text-secondary)]"
>
  <!-- Outside-click / Escape catcher; only mounted while a menu is open. -->
  @if (openMenu() !== null) {
    <div
      class="fixed inset-0 z-30"
      role="presentation"
      (click)="close()"
      (keydown.escape)="close()"
    ></div>
  }

  <div class="relative z-40">
    <button
      type="button"
      (click)="toggle('file')"
      [class]="
        (openMenu() === 'file'
          ? 'bg-[var(--color-bg-elevated)] text-[var(--color-text-primary)] '
          : '') +
        'rounded px-3 py-1 transition hover:bg-[var(--color-bg-elevated)] hover:text-[var(--color-text-primary)]'
      "
    >
      File
    </button>
    @if (openMenu() === 'file') {
      <div
        class="absolute left-0 top-full z-40 mt-0.5 min-w-[200px] rounded border border-[var(--color-border-strong)] bg-[var(--color-bg-surface)] p-1 shadow-xl"
        role="menu"
      >
        <button
          type="button"
          (click)="addFiles()"
          class="flex w-full items-center gap-2 rounded px-3 py-1.5 text-left text-[var(--color-text-primary)] transition hover:bg-[var(--color-bg-elevated)]"
        >
          <fa-icon [icon]="faPlus" />
          Add Files…
        </button>
        <button
          type="button"
          (click)="importItunes()"
          class="flex w-full items-center gap-2 rounded px-3 py-1.5 text-left text-[var(--color-text-primary)] transition hover:bg-[var(--color-bg-elevated)]"
        >
          <fa-icon [icon]="faFileImport" />
          Import iTunes library…
        </button>
      </div>
    }
  </div>

  <div class="relative z-40">
    <button
      type="button"
      (click)="toggle('settings')"
      [class]="
        (openMenu() === 'settings'
          ? 'bg-[var(--color-bg-elevated)] text-[var(--color-text-primary)] '
          : '') +
        'rounded px-3 py-1 transition hover:bg-[var(--color-bg-elevated)] hover:text-[var(--color-text-primary)]'
      "
    >
      Settings
    </button>
    @if (openMenu() === 'settings') {
      <div
        class="absolute left-0 top-full z-40 mt-0.5 min-w-[200px] rounded border border-[var(--color-border-strong)] bg-[var(--color-bg-surface)] p-1 shadow-xl"
        role="menu"
      >
        <button
          type="button"
          (click)="openPreferences()"
          class="flex w-full items-center gap-2 rounded px-3 py-1.5 text-left text-[var(--color-text-primary)] transition hover:bg-[var(--color-bg-elevated)]"
        >
          <fa-icon [icon]="faGear" />
          Preferences…
        </button>
      </div>
    }
  </div>
</nav>
