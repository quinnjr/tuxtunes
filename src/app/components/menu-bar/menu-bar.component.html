<!--
  "deep" makes every non-clickable pixel of the bar a drag handle
  (a bare attribute only matches the nav itself, leaving the gaps
  between the menus dead). Buttons block dragging on their own; the
  menu popovers and the click catcher opt out explicitly.

  Padding: on macOS the native traffic lights overlay the left edge, so
  the bar pads past them; on Linux/Windows our caption buttons sit
  flush against the right edge, so the bar drops its right padding.
-->
<!--
  Outside-click catcher. It lives OUTSIDE the nav on purpose:
  `.mac-toolbar` sets `backdrop-filter`, which makes the nav the
  containing block for its fixed-position descendants, so `inset-0`
  inside it would resolve to a 32px-tall strip instead of the viewport
  and clicks in the track list would never close the menu. Escape is
  handled on the component host — a div with no tabindex is never on
  the key event path.
-->
@if (openMenu() !== null) {
  <div
    data-tauri-drag-region="false"
    class="fixed inset-0 z-30"
    role="presentation"
    (click)="close()"
  ></div>
}

<nav
  data-tauri-drag-region="deep"
  class="mac-toolbar relative z-40 flex h-8 shrink-0 select-none items-center gap-1 pl-2 pr-2 text-body text-text-secondary"
  [class.pl-20]="win.nativeTrafficLights()"
  [class.pr-0]="win.customControls()"
>
  <div class="relative z-40">
    <button
      type="button"
      (click)="toggle('file')"
      [class]="
        (openMenu() === 'file' ? 'bg-bg-elevated text-text-primary ' : '') +
        'mac-btn h-6 px-3 text-body'
      "
    >
      File
    </button>
    @if (openMenu() === 'file') {
      <div
        data-tauri-drag-region="false"
        class="absolute left-0 top-full z-40 mt-0.5 min-w-[200px] rounded-lg border border-border-strong bg-bg-surface p-1 shadow-xl"
        role="menu"
      >
        <button
          type="button"
          (click)="addFile()"
          class="mac-btn flex w-full items-center gap-2 px-3 py-1.5 text-left text-text-primary"
        >
          <fa-icon [icon]="faPlus" />
          Add Files…
        </button>
        <button
          type="button"
          (click)="addFolder()"
          class="mac-btn flex w-full items-center gap-2 px-3 py-1.5 text-left text-text-primary"
        >
          <fa-icon [icon]="faFolderPlus" />
          Add Folder…
        </button>
        <button
          type="button"
          (click)="newSmartPlaylist()"
          class="mac-btn flex w-full items-center gap-2 px-3 py-1.5 text-left text-text-primary"
        >
          <fa-icon [icon]="faWand" />
          New Smart Playlist…
        </button>
        <button
          type="button"
          (click)="importItunes()"
          class="mac-btn flex w-full items-center gap-2 px-3 py-1.5 text-left text-text-primary"
        >
          <fa-icon [icon]="faFileImport" />
          Import iTunes library…
        </button>
        @if (win.available) {
          <div class="my-1 h-px bg-border" role="separator"></div>
          <button
            type="button"
            (click)="exit()"
            class="mac-btn flex w-full items-center justify-between gap-2 px-3 py-1.5 text-left text-text-primary"
          >
            <span class="flex items-center gap-2">
              <fa-icon [icon]="faExit" />
              Exit
            </span>
            <span class="text-caption text-text-muted">Ctrl+Q</span>
          </button>
        }
      </div>
    }
  </div>

  <div class="relative z-40">
    <button
      type="button"
      (click)="toggle('settings')"
      [class]="
        (openMenu() === 'settings' ? 'bg-bg-elevated text-text-primary ' : '') +
        'mac-btn h-6 px-3 text-body'
      "
    >
      Settings
    </button>
    @if (openMenu() === 'settings') {
      <div
        data-tauri-drag-region="false"
        class="absolute left-0 top-full z-40 mt-0.5 min-w-[200px] rounded-lg border border-border-strong bg-bg-surface p-1 shadow-xl"
        role="menu"
      >
        <button
          type="button"
          (click)="openPreferences()"
          class="mac-btn flex w-full items-center gap-2 px-3 py-1.5 text-left text-text-primary"
        >
          <fa-icon [icon]="faGear" />
          Preferences…
        </button>
      </div>
    }
  </div>

  <!-- Right edge: Linux/Windows caption buttons (nothing on macOS). -->
  <app-window-controls class="ml-auto flex" />
</nav>
