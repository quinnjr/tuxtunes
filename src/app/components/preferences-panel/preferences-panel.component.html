@if (open()) {
  <div class="mac-sheet-backdrop fixed inset-0 z-50 flex items-center justify-center">
    <div class="mac-sheet flex max-h-[90vh] w-[560px] flex-col gap-4 overflow-auto p-6">
      <header class="hairline-b flex items-center justify-between pb-3">
        <h2 class="text-headline font-semibold text-text-primary">Preferences</h2>
        <button type="button" class="mac-btn h-7 w-7" (click)="hide()">
          <span class="text-body">✕</span>
        </button>
      </header>

      <div class="flex flex-col gap-1.5 text-body">
        <span class="text-text-secondary">Color mode</span>
        <div class="mac-segmented w-fit" role="radiogroup" aria-label="Color mode">
          @for (m of colorModes; track m) {
            <button
              type="button"
              role="radio"
              [attr.aria-checked]="theme.mode() === m"
              (click)="theme.set(m)"
              [class]="'mac-segment capitalize ' + (theme.mode() === m ? 'selected' : '')"
            >
              {{ m }}
            </button>
          }
        </div>
      </div>

      <div class="flex flex-col gap-1.5 text-body">
        <span class="text-text-secondary">Library root</span>
        <div class="flex items-center gap-2">
          <span
            class="flex-1 truncate rounded-md border border-border bg-bg-primary px-2 py-1.5 tnum text-footnote text-text-primary"
          >
            {{ draftRoot() || '(not set)' }}
          </span>
          <button type="button" (click)="pickRoot()" class="mac-btn h-8 px-3 bg-bg-elevated">
            Pick…
          </button>
        </div>
      </div>

      <label class="flex flex-col gap-1.5 text-body">
        <span class="text-text-secondary">Organize scheme</span>
        <input
          class="rounded-md border border-border bg-bg-primary px-2 py-1.5 text-footnote tnum text-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
          [ngModel]="draftScheme()"
          (ngModelChange)="draftScheme.set($event)"
        />
        <span class="text-caption text-text-muted">
          Preview: <span class="tnum">{{ preview() }}</span>
        </span>
      </label>

      <label class="flex items-center gap-2 text-body text-text-primary">
        <input
          type="checkbox"
          [checked]="draftKeep()"
          (change)="toggleKeep()"
          class="accent-accent"
        />
        Keep library organized (rename on metadata edit)
      </label>

      <footer class="hairline-t mt-2 flex justify-end gap-2 pt-3">
        <button type="button" (click)="hide()" class="mac-btn h-8 px-4 bg-bg-elevated">
          Cancel
        </button>
        <button
          type="button"
          (click)="save()"
          class="rounded-md bg-accent px-4 py-1.5 text-body font-medium text-white hover:bg-accent-hover"
        >
          Save
        </button>
      </footer>
    </div>
  </div>
}
