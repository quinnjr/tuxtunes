<div class="mac-vibrancy grid h-full grid-cols-3 divide-x divide-border">
  @for (pane of visiblePanes(); track pane.column; let i = $index) {
    <div class="flex h-full min-h-0 flex-col">
      <header
        class="hairline-b flex items-center gap-2 px-3 py-1 text-caption uppercase tracking-wide text-text-muted"
      >
        <span class="flex-1">{{ paneTitle(pane.column) }}</span>
        @if (activeValuesFor(pane.column).length > 0) {
          <button
            type="button"
            (click)="clearPane(pane.column)"
            class="text-caption2 normal-case text-accent hover:text-accent-hover"
          >
            Clear
          </button>
        }
      </header>
      <div class="hairline-b px-2 py-1">
        <input
          type="search"
          placeholder="Filter…"
          [value]="paneSearchValue(i)"
          (input)="onPaneSearchInput(i, $event)"
          class="w-full rounded-md bg-bg-primary px-2 py-0.5 text-body text-text-primary outline-none focus-visible:ring-1 focus-visible:ring-accent"
        />
      </div>
      <ul class="min-h-0 flex-1 overflow-y-auto text-body">
        @if (pane.values.length === 0) {
          <li class="px-3 py-1 italic text-text-muted">No matches</li>
        } @else {
          @for (v of pane.values; track trackByValue($index, v)) {
            <li>
              <button
                type="button"
                (click)="onValueClick(pane.column, v.value, $event)"
                [class]="
                  'flex w-full items-baseline justify-between rounded-md px-3 py-1 text-left ' +
                  (isSelected(pane.column, v.value)
                    ? 'bg-accent text-white'
                    : 'hover:bg-bg-elevated')
                "
              >
                <span class="truncate">{{ v.value }}</span>
                <span class="tnum ml-2 text-caption2 opacity-70">({{ v.count }})</span>
              </button>
            </li>
          }
        }
      </ul>
    </div>
  }
</div>
