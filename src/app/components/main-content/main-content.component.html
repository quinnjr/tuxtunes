<section class="flex h-full flex-1 flex-col bg-bg-primary">
  <header class="mac-toolbar flex items-center gap-2 px-4 py-2">
    <div class="mac-segmented">
      @for (mode of modes; track mode) {
        <button
          type="button"
          [attr.aria-selected]="viewMode() === mode"
          [class.selected]="viewMode() === mode"
          class="mac-segment capitalize"
          (click)="setMode(mode)"
        >
          {{ mode }}
        </button>
      }
    </div>
    <div class="ml-auto flex items-center gap-2">
      <div
        class="flex items-center gap-2 rounded-md border border-border bg-bg-surface px-2 py-1 text-body focus-within:border-accent"
      >
        <input
          type="search"
          placeholder="Search title, artist, album…"
          [value]="library.search()"
          (input)="onSearchInput($event)"
          class="w-56 bg-transparent text-text-primary outline-none placeholder:text-text-muted"
        />
        @if (library.search().length > 0) {
          <button
            type="button"
            (click)="clearSearch()"
            aria-label="Clear search"
            class="mac-btn h-5 w-5 text-xs"
          >
            ✕
          </button>
        }
      </div>
      <button
        type="button"
        (click)="toggleBrowser()"
        [class]="
          'rounded-md px-3 py-1 text-body ' +
          (ui.columnBrowserOpen()
            ? 'bg-accent text-white'
            : 'border border-border text-text-secondary hover:text-accent')
        "
        title="Toggle Column Browser"
      >
        Browse
      </button>
    </div>
  </header>
  <div class="flex flex-1 flex-col overflow-hidden">
    @if (ui.columnBrowserOpen()) {
      <div class="hairline-b h-56 shrink-0">
        <app-column-browser class="block h-full" />
      </div>
    }
    <div class="flex-1 overflow-hidden">
      @switch (viewMode()) {
        @case ('tracks') {
          <app-track-list-view class="block h-full" />
        }
        @case ('albums') {
          <app-album-grid-view class="block h-full" />
        }
        @case ('artists') {
          <app-artist-split-view class="block h-full" />
        }
        @default {
          <div class="flex h-full items-center justify-center text-text-muted">
            {{ viewMode() }} view — coming soon
          </div>
        }
      }
    </div>
  </div>
</section>
