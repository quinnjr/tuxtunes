@if (win.customControls()) {
  <!--
    Native caption buttons for the frameless window on Linux and
    Windows: minimize, maximize, close, right-aligned, the order every
    desktop there uses. macOS never reaches this branch — its own
    traffic lights overlay the toolbar.

    tabindex=-1: window controls are never in the tab ring.
    z-40: the menu bar's outside-click catcher (z-30) must not cover them.
  -->
  <div
    class="win-controls relative z-40 -mr-2 flex h-8 shrink-0 items-stretch self-stretch"
    role="group"
    aria-label="Window controls"
  >
    <button
      type="button"
      tabindex="-1"
      class="win-control win-control-minimize"
      aria-label="Minimize"
      title="Minimize"
      (click)="minimize()"
    >
      <svg viewBox="0 0 10 10" aria-hidden="true">
        <path d="M0 5h10" />
      </svg>
    </button>
    <button
      type="button"
      tabindex="-1"
      class="win-control win-control-maximize"
      [attr.data-zoom]="zoomAction()"
      [attr.aria-label]="zoomLabel()"
      [title]="zoomLabel()"
      (click)="zoom($event)"
    >
      @if (zoomAction() === 'maximize') {
        <svg viewBox="0 0 10 10" aria-hidden="true">
          <rect x="0.5" y="0.5" width="9" height="9" />
        </svg>
      } @else {
        <svg viewBox="0 0 10 10" aria-hidden="true">
          <path d="M2.5 2.5V0.5h7v7h-2" />
          <rect x="0.5" y="2.5" width="7" height="7" />
        </svg>
      }
    </button>
    <button
      type="button"
      tabindex="-1"
      class="win-control win-control-close"
      aria-label="Close"
      title="Close"
      (click)="close()"
    >
      <svg viewBox="0 0 10 10" aria-hidden="true">
        <path d="M0.5 0.5l9 9M9.5 0.5l-9 9" />
      </svg>
    </button>
  </div>
}
