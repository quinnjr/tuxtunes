@if (win.customControls()) {
  <!--
    tabindex=-1: native window controls are never in the tab ring, and
    with them first in DOM order a Tab+Enter from launch would quit.
    z-40: the menu bar's outside-click catcher (z-30) must not cover them.
  -->
  <div
    class="mac-traffic-lights relative z-40 flex shrink-0 items-center gap-2 pl-1 pr-2"
    role="group"
    aria-label="Window controls"
  >
    <button
      type="button"
      tabindex="-1"
      class="mac-traffic-light mac-traffic-light-close"
      aria-label="Close"
      title="Close"
      (click)="close()"
    >
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <path d="M3.5 3.5l5 5M8.5 3.5l-5 5" />
      </svg>
    </button>
    <button
      type="button"
      tabindex="-1"
      class="mac-traffic-light mac-traffic-light-minimize"
      aria-label="Minimize"
      title="Minimize"
      (click)="minimize()"
    >
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <path d="M3 6h6" />
      </svg>
    </button>
    <button
      type="button"
      tabindex="-1"
      class="mac-traffic-light mac-traffic-light-zoom"
      [attr.data-zoom]="zoomAction()"
      [attr.aria-label]="zoomLabel()"
      [title]="zoomLabel()"
      (click)="zoom($event)"
    >
      @if (zoomAction() === 'maximize') {
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 5V3h2M9 7v2H7" />
        </svg>
      } @else {
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <path d="M3 6.5V9h2.5M9 5.5V3H6.5" />
        </svg>
      }
    </button>
  </div>
}
