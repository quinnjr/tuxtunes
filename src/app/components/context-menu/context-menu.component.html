@if (ctx.open(); as state) {
  <div
    class="fixed inset-0 z-50"
    (click)="ctx.hide()"
    (keydown.escape)="ctx.hide()"
    role="presentation"
  >
    <ul
      data-context-menu
      class="mac-sheet absolute min-w-[200px] rounded-lg py-1 text-body"
      [style.left.px]="state.x"
      [style.top.px]="state.y"
    >
      @for (item of state.items; track $index) {
        @if (isDivider(item)) {
          <li class="my-1 h-px bg-border" role="separator"></li>
        } @else {
          <li class="px-1">
            <button
              type="button"
              [disabled]="item.disabled"
              (click)="onItemClick(item); $event.stopPropagation()"
              [class]="
                'flex w-full items-center rounded-md px-2 py-1 text-left hover:bg-accent hover:text-white disabled:opacity-50 ' +
                (item.destructive ? 'text-accent' : 'text-text-primary')
              "
            >
              {{ item.label }}
            </button>
          </li>
        }
      }
    </ul>
  </div>
}
