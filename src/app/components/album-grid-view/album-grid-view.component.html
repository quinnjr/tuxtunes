<div class="h-full overflow-y-auto bg-bg-primary p-6">
  @if (library.albums().length === 0) {
    <div class="flex h-full items-center justify-center text-text-muted">No albums in library</div>
  } @else {
    <div class="grid grid-cols-[repeat(auto-fill,minmax(170px,1fr))] gap-6">
      @for (a of library.albums(); track trackByAlbum($index, a)) {
        <div class="flex flex-col gap-2" (contextmenu)="onAlbumContextMenu(a, $event)">
          <button type="button" (click)="toggle(a)" class="group flex flex-col gap-2 text-left">
            <div class="mac-card aspect-square bg-bg-tertiary">
              @if (coverUrl(a.artworkPath); as src) {
                <img [src]="src" alt="" class="h-full w-full object-cover" />
              } @else {
                <div class="flex h-full w-full items-center justify-center text-text-muted">
                  <span class="text-caption2 uppercase tracking-wider">No art</span>
                </div>
              }
            </div>
            <div class="flex flex-col">
              <span class="truncate text-body font-medium text-text-primary">{{ a.album }}</span>
              <span class="truncate text-caption text-text-secondary">
                {{ a.albumArtist }}
                @if (a.year) {
                  <span class="text-text-muted"> · {{ a.year }}</span>
                }
              </span>
              <span class="tnum text-caption text-text-muted">
                {{ a.trackCount }} {{ a.trackCount === 1 ? 'track' : 'tracks' }}
              </span>
            </div>
          </button>
          @if (isExpanded(a)) {
            <ul class="divide-y divide-border rounded-md bg-bg-surface text-body">
              @for (t of expandedTracks(); track trackByTrack($index, t)) {
                <li
                  (dblclick)="play(t)"
                  (contextmenu)="onTrackContextMenu(t, $event); $event.stopPropagation()"
                  class="flex cursor-pointer items-center gap-2 px-2 py-1 hover:bg-bg-elevated"
                >
                  <span class="flex-1 truncate">{{ t.title }}</span>
                  <span class="tnum text-text-muted">{{ formatDuration(t.durationMs) }}</span>
                </li>
              }
            </ul>
          }
        </div>
      }
    </div>
  }
</div>
