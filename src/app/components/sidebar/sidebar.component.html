<aside class="mac-vibrancy flex h-full w-64 flex-col gap-0.5 py-3 text-body text-text-secondary">
  <div class="px-4 pb-2 text-caption font-semibold uppercase tracking-wide text-text-muted">
    Library
  </div>
  <div class="flex flex-col gap-0.5 px-2">
    <button
      type="button"
      (click)="setView('tracks')"
      [class]="'mac-sidebar-item w-full ' + (isActive('tracks') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M4 6h12M4 10h12M4 14h8" stroke-linecap="round" />
      </svg>
      <span>All Songs</span>
    </button>
    <button
      type="button"
      (click)="setView('artists')"
      [class]="'mac-sidebar-item w-full ' + (isActive('artists') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <circle cx="10" cy="7" r="3" />
        <path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round" />
      </svg>
      <span>Artists</span>
    </button>
    <button
      type="button"
      (click)="setView('albums')"
      [class]="'mac-sidebar-item w-full ' + (isActive('albums') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="3" y="3" width="14" height="14" rx="2" />
        <circle cx="10" cy="10" r="2.5" />
      </svg>
      <span>Albums</span>
    </button>
    <button
      type="button"
      (click)="setView('genres')"
      [class]="'mac-sidebar-item w-full ' + (isActive('genres') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M3 6l7-3 7 3-7 3-7-3z" stroke-linejoin="round" />
        <path d="M3 10l7 3 7-3M3 14l7 3 7-3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Genres</span>
    </button>
  </div>

  <div
    class="flex min-h-0 flex-1 flex-col"
    (contextmenu)="onPlaylistAreaContextMenu($event)"
    role="presentation"
  >
    <div class="mt-4 px-4 pb-2 text-caption font-semibold uppercase tracking-wide text-text-muted">
      Playlists
    </div>
    @if (tree().length === 0) {
      <div class="px-4 py-1 italic text-text-muted">No playlists yet</div>
    } @else {
      <div class="flex min-h-0 flex-1 flex-col gap-0.5 overflow-y-auto px-2" role="tree">
        <ng-container *ngTemplateOutlet="nodes; context: { $implicit: tree(), depth: 0 }" />
      </div>
    }
  </div>

  <div class="shrink-0">
    <div
      class="mt-4 flex items-center justify-between px-4 pb-2 text-caption font-semibold uppercase tracking-wide text-text-muted"
    >
      <span>Devices</span>
      <button
        type="button"
        class="rounded px-1 text-text-muted hover:text-text-primary"
        title="Rescan for devices"
        aria-label="Rescan for devices"
        (click)="rescanDevices()"
      >
        <svg
          class="h-3.5 w-3.5"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M16 10a6 6 0 1 1-1.8-4.3M16 3v3h-3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
    @if (devices().length === 0) {
      <div class="px-4 py-1 italic text-text-muted">No devices connected</div>
    } @else {
      <div class="flex max-h-48 flex-col gap-0.5 overflow-y-auto px-2">
        @for (device of devices(); track device.id) {
          <button
            type="button"
            [class]="
              'mac-sidebar-item w-full ' +
              (isDeviceActive(device) ? 'selected ' : '') +
              (isAttached(device) ? '' : 'opacity-50')
            "
            [title]="deviceTitle(device)"
            (click)="openDevice(device)"
            (contextmenu)="onDeviceContextMenu(device, $event)"
          >
            <svg
              class="h-4 w-4 shrink-0"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              @if (device.kind === 'filesystem') {
                <rect x="2.5" y="5" width="15" height="10" rx="2" />
                <circle cx="14.5" cy="10" r="1" />
              } @else {
                <rect x="5.5" y="2.5" width="9" height="15" rx="2" />
                <path d="M8.5 15.5h3" stroke-linecap="round" />
              }
            </svg>
            <span class="truncate">{{ device.name }}</span>
            @if (isSyncing(device)) {
              <span class="ml-auto shrink-0 text-caption tabular-nums text-text-muted">
                {{ syncPercent() }}%
              </span>
            }
          </button>
        }
      </div>
    }
  </div>

  <ng-template #nodes let-items let-depth="depth">
    @for (node of items; track node.playlist.id) {
      <button
        type="button"
        role="treeitem"
        [attr.aria-selected]="isPlaylistActive(node.playlist)"
        [attr.aria-expanded]="isFolder(node) ? isExpanded(node.playlist) : null"
        [attr.data-playlist-id]="node.playlist.id"
        [style.padding-left.rem]="0.5 + depth * 0.75"
        [class]="'mac-sidebar-item w-full ' + (isPlaylistActive(node.playlist) ? 'selected' : '')"
        [title]="node.playlist.name"
        (click)="onPlaylistClick(node)"
        (contextmenu)="onPlaylistContextMenu(node, $event)"
      >
        @switch (isFolder(node) ? 'folder' : node.playlist.kind) {
          @case ('folder') {
            <svg
              class="h-4 w-4 shrink-0 transition-transform"
              [class.rotate-90]="isExpanded(node.playlist)"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M7 5l6 5-6 5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('smart') {
            <svg
              class="h-4 w-4 shrink-0"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                d="M10 3l1.8 4.2L16 8l-3.2 2.9.9 4.6L10 13.2 6.3 15.5l.9-4.6L4 8l4.2-.8z"
                stroke-linejoin="round"
              />
            </svg>
          }
          @default {
            <svg
              class="h-4 w-4 shrink-0"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M4 6h9M4 10h9M4 14h6" stroke-linecap="round" />
              <circle cx="15.5" cy="13.5" r="1.5" />
            </svg>
          }
        }
        <span class="truncate">{{ node.playlist.name }}</span>
      </button>
      @if (isFolder(node) && isExpanded(node.playlist)) {
        <ng-container
          *ngTemplateOutlet="nodes; context: { $implicit: node.children, depth: depth + 1 }"
        />
      }
    }
  </ng-template>
</aside>
