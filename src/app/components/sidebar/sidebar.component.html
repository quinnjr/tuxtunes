<aside
  class="flex h-full w-64 flex-col border-r border-[var(--color-border)] bg-[var(--color-bg-surface)] py-3 text-sm text-[var(--color-text-secondary)]"
>
  <div
    class="px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-[var(--color-text-muted)]"
  >
    Library
  </div>
  <button
    type="button"
    (click)="setView('tracks')"
    [class]="
      isActive('tracks')
        ? 'border-l-2 border-[var(--color-accent)] bg-[var(--color-bg-elevated)] px-4 py-1 text-left text-[var(--color-text-primary)]'
        : 'border-l-2 border-transparent px-4 py-1 text-left hover:bg-[var(--color-bg-elevated)]'
    "
  >
    All Songs
  </button>
  <button
    type="button"
    (click)="setView('artists')"
    [class]="
      isActive('artists')
        ? 'border-l-2 border-[var(--color-accent)] bg-[var(--color-bg-elevated)] px-4 py-1 text-left text-[var(--color-text-primary)]'
        : 'border-l-2 border-transparent px-4 py-1 text-left hover:bg-[var(--color-bg-elevated)]'
    "
  >
    Artists
  </button>
  <button
    type="button"
    (click)="setView('albums')"
    [class]="
      isActive('albums')
        ? 'border-l-2 border-[var(--color-accent)] bg-[var(--color-bg-elevated)] px-4 py-1 text-left text-[var(--color-text-primary)]'
        : 'border-l-2 border-transparent px-4 py-1 text-left hover:bg-[var(--color-bg-elevated)]'
    "
  >
    Albums
  </button>
  <button
    type="button"
    (click)="setView('genres')"
    [class]="
      isActive('genres')
        ? 'border-l-2 border-[var(--color-accent)] bg-[var(--color-bg-elevated)] px-4 py-1 text-left text-[var(--color-text-primary)]'
        : 'border-l-2 border-transparent px-4 py-1 text-left hover:bg-[var(--color-bg-elevated)]'
    "
  >
    Genres
  </button>

  <div
    class="mt-4 px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-[var(--color-text-muted)]"
  >
    Playlists
  </div>
  <div class="px-4 py-1 italic text-[var(--color-text-muted)]">No playlists yet</div>
</aside>
