<aside class="mac-vibrancy flex h-full w-64 flex-col gap-0.5 py-3 text-body text-text-secondary">
  <div class="px-4 pb-2 text-caption font-semibold uppercase tracking-wide text-text-muted">
    Library
  </div>
  <div class="flex flex-col gap-0.5 px-2">
    <button
      type="button"
      (click)="setView('tracks')"
      [class]="'mac-sidebar-item w-full ' + (isActive('tracks') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M4 6h12M4 10h12M4 14h8" stroke-linecap="round" />
      </svg>
      <span>All Songs</span>
    </button>
    <button
      type="button"
      (click)="setView('artists')"
      [class]="'mac-sidebar-item w-full ' + (isActive('artists') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <circle cx="10" cy="7" r="3" />
        <path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round" />
      </svg>
      <span>Artists</span>
    </button>
    <button
      type="button"
      (click)="setView('albums')"
      [class]="'mac-sidebar-item w-full ' + (isActive('albums') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="3" y="3" width="14" height="14" rx="2" />
        <circle cx="10" cy="10" r="2.5" />
      </svg>
      <span>Albums</span>
    </button>
    <button
      type="button"
      (click)="setView('genres')"
      [class]="'mac-sidebar-item w-full ' + (isActive('genres') ? 'selected' : '')"
    >
      <svg
        class="h-4 w-4 shrink-0"
        viewBox="0 0 20 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M3 6l7-3 7 3-7 3-7-3z" stroke-linejoin="round" />
        <path d="M3 10l7 3 7-3M3 14l7 3 7-3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Genres</span>
    </button>
  </div>

  <div class="mt-4 px-4 pb-2 text-caption font-semibold uppercase tracking-wide text-text-muted">
    Playlists
  </div>
  <div class="px-4 py-1 italic text-text-muted">No playlists yet</div>
</aside>
